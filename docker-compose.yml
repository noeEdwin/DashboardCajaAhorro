services:
  postgres:
    image: postgres:16-alpine
    container_name: horizonte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horizonte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizonte_pass}
      POSTGRES_DB: ${POSTGRES_DB:-caja_ahorro_oaxaca}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horizonte} -d ${POSTGRES_DB:-caja_ahorro_oaxaca}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
